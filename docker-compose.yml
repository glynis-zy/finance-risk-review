# 财务单据智能风险审核系统 — MySQL 8 测试库
# 用法：docker compose up -d
services:
  mysql:
    image: mysql:8
    container_name: frr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Atguigu.123
      MYSQL_DATABASE: finance_risk
      MYSQL_USER: atguigu
      MYSQL_PASSWORD: Atguigu.123
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uatguigu", "-pAtguigu.123"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
